  <!-- === DEV SOFTWARE DATA + RENDER === -->
  <script>
    var DEV_SOFTWARE = [
      {
        id: 'spark-store',
        name: 'Spark Store',
        logo: '/assets/sparkstore.png',
        tags: ['Extensions', 'Marketplace'],
        downloads: [
          { label: 'GitHub', url: 'https://github.com/ll1ness/spark-store', primary: true }
        ]
      }
    ];

    function i18nText(key) {
      return window.I18N ? window.I18N.t(key) : key;
    }

    function renderDevs() {
      var grid = document.getElementById('devs-grid');
      if (!grid) return;
      grid.innerHTML = '';

      DEV_SOFTWARE.forEach(function (p) {
        var card = document.createElement('div');
        card.className = 'devs-card';

        var head = document.createElement('div');
        head.className = 'devs-card-head';
        var logo = document.createElement('img');
        logo.className = 'devs-logo';
        logo.src = p.logo;
        logo.alt = p.name;
        head.appendChild(logo);

        var headText = document.createElement('div');
        var name = document.createElement('div');
        name.className = 'devs-card-name';
        name.textContent = p.name;
        var tagline = document.createElement('div');
        tagline.className = 'devs-card-tagline';
        tagline.textContent = i18nText('dev.spark.tagline');
        headText.appendChild(name);
        headText.appendChild(tagline);
        head.appendChild(headText);
        card.appendChild(head);

        var desc = document.createElement('div');
        desc.className = 'devs-card-desc';
        desc.textContent = i18nText('dev.spark.desc');
        card.appendChild(desc);

        if (p.tags && p.tags.length) {
          var tags = document.createElement('div');
          tags.className = 'devs-tags';
          p.tags.forEach(function (t) {
            var span = document.createElement('span');
            span.className = 'to-tag';
            span.setAttribute('data-variant', 'default');
            span.textContent = t;
            tags.appendChild(span);
          });
          card.appendChild(tags);
        }

        var dl = document.createElement('div');
        dl.className = 'devs-downloads';
        (p.downloads || []).forEach(function (d) {
          var a = document.createElement('a');
          a.className = 'to-button';
          if (d.primary) a.setAttribute('data-variant', 'primary');
          a.href = d.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = d.label + ' ↗';
          dl.appendChild(a);
        });
        card.appendChild(dl);

        // подсветка за курсором (как на главной)
        card.addEventListener('pointermove', function (e) {
          var r = card.getBoundingClientRect();
          card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
          card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
        });

        grid.appendChild(card);
      });
    }

    renderDevs();
    document.addEventListener('i18n:change', renderDevs);
  </script>
